<tr>
  <td style="padding:16px 20px; border-bottom:1px solid #EFEDF7;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
      <tr>
        <td valign="top" style="font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:22px; mso-line-height-rule:exactly; color:#231F3E;">
          <strong>{{ProductName}}</strong><br />
          <span style="font-family:'Courier New',Courier,monospace; font-size:12px; color:#7A7596;">Qty {{Quantity}} &nbsp;&middot;&nbsp; {{UnitPrice}} each</span>
        </td>
        <td valign="top" align="right" width="90" style="font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:22px; mso-line-height-rule:exactly; font-weight:bold; color:#231F3E; white-space:nowrap;">{{LineTotal}}</td>
      </tr>
    </table>
  </td>
</tr>
